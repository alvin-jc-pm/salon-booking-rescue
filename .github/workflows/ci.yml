name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests on ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, sqlite]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: salon
          POSTGRES_DB: salon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          # Throwaway credentials for the CI database container only.
          TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql://salon:salon@localhost:5432/salon_test' || '' }}
        run: pytest -v

  docker:
    name: Docker image against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: salon
          POSTGRES_DB: salon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t salon-booking .
      - name: Start the container the way a host would, with PORT set
        run: |
          echo "ADMIN_API_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
          source "$GITHUB_ENV"
          docker run -d --name app --network host \
            -e PORT=8080 \
            -e DATABASE_URL=postgresql://salon:salon@localhost:5432/salon \
            -e ADMIN_API_KEY="$ADMIN_API_KEY" \
            salon-booking
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
      - name: Replay every request from BEFORE.md
        run: python3 evidence/after_check.py http://localhost:8080
      - name: Container runs as a non-root user
        run: test "$(docker exec app id -u)" != "0"
      - if: always()
        run: docker logs app
